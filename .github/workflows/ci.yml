name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Every job gets a read-only token unless it asks for more; only the release job does (below). Nothing in this file reads a
# repository secret, so a pull request, including one from a fork, runs with a read-only token and no secrets at all.
permissions:
  contents: read

# Actions are pinned to a full commit SHA, with the release it stands for in the comment, so a moved or re-pointed tag cannot
# change what runs here. Dependabot (.github/dependabot.yml) proposes the updates, and a test (RepositoryHardeningTests) fails
# the build for any `uses:` that is not pinned.
#
# Shape of the pipeline (the contract is in docs/PARITY-FOUNDATIONS.md, "Releases, installer and updates"):
#   build    restore, build, test the whole solution                                   (every run)
#   package  publish both exes, build the zip and the installer, checksums, layout and  (every run, after build; read-only token)
#            version checks; uploads the result as the workflow artifact "dist"
#   release  only for a v* tag: re-checks the artifact, attests every asset, creates the GitHub release
# A push to main therefore produces the Setup.exe and the zip as downloadable workflow artifacts and releases nothing.
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      # Restore also audits every package, transitive ones included (Directory.Build.props): a known vulnerability fails here.
      - name: Restore
        run: dotnet restore DefenseClaw.Win.sln
      - name: Build
        run: dotnet build DefenseClaw.Win.sln --no-restore -c Release
      # The whole solution, so both test projects run: DefenseClaw.Tests (Core) and DefenseClaw.App.Tests (the WPF
      # app layer, which needs the Windows desktop runtime that windows-latest has).
      - name: Test
        run: dotnet test DefenseClaw.Win.sln --no-build -c Release --logger "trx"

  package:
    needs: build
    runs-on: windows-latest
    env:
      # Inno Setup is installed from the Chocolatey community package, pinned to this exact version. Chocolatey verifies the
      # installer it downloads against the SHA-256 recorded in that (moderated, versioned) package, and fails the install on a
      # mismatch; the step below then checks the compiler that was installed reports this same version. To upgrade: change the
      # version here and read the package page's verification notes first.
      INNO_SETUP_VERSION: '6.6.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      # The version comes from the tag and from nowhere else: v1.2.3 -> 1.2.3. Anything that is not exactly vX.Y.Z fails the run.
      # An untagged build (a push to main, a pull request) is 0.0.0-dev, lower than every release (Directory.Build.props).
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 12)
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw "The tag '$env:GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH." }
            $version = $Matches[1]
          } else {
            $version = '0.0.0-dev'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "informational=$version+$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version (informational $version+$sha)"
      # A release with nothing to say fails here, before anything is built: the CHANGELOG.md section for the tag, or the tag's
      # annotated message, must be there.
      - name: Check the release description exists
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --force origin "+refs/tags/${env:TAG}:refs/tags/${env:TAG}"
          $message = git for-each-ref "refs/tags/${env:TAG}" --format='%(contents)'
          ./tools/release/New-ReleaseNotes.ps1 -Version '${{ steps.version.outputs.version }}' -TagMessage ($message -join "`n") -CheckOnly
      - name: Restore
        run: dotnet restore DefenseClaw.Win.sln
      # ReadyToRun (not composite) is switched on by DefenseClaw.App.csproj for exactly this self-contained single-file
      # publish, so a local run of this command produces the same exe. Compression is deliberately off (see the csproj:
      # +80 MB private memory for ~0.1 s at login). The app is not trimmed. Both exes are self-contained: the portable zip and the
      # installer need no separately installed .NET runtime.
      - name: Publish single-file exe
        run: >
          dotnet publish DefenseClaw.App/DefenseClaw.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.informational }}
          -o publish
      # The elevated helper of "Run gateway as administrator" (DefenseClaw.GatewayAdmin.exe), published next to the app. The app
      # finds it in its own folder and shows the operator its SHA-256 before the one Windows prompt that installs it in Program Files.
      - name: Publish administrator helper
        run: >
          dotnet publish DefenseClaw.GatewayAdmin/DefenseClaw.GatewayAdmin.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.informational }}
          -o publish
      - name: Install Inno Setup (pinned)
        shell: pwsh
        run: |
          choco install innosetup --version $env:INNO_SETUP_VERSION --no-progress --yes --limit-output
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)." }
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe was not found after the install.' }
          $found = (Get-Item $iscc).VersionInfo.ProductVersion
          if (-not $found.StartsWith($env:INNO_SETUP_VERSION)) { throw "ISCC reports version $found, expected $env:INNO_SETUP_VERSION." }
          "ISCC=$iscc" >> $env:GITHUB_ENV
          Write-Host "Inno Setup $found at $iscc"
      # Assets, exact names (the updater and install.ps1 rely on them): Setup, a zip with exactly the two exes at its root,
      # install.ps1, and checksums.txt over all of them.
      - name: Assemble release assets
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path publish/DefenseClaw.App.exe, publish/DefenseClaw.GatewayAdmin.exe -DestinationPath "dist/DefenseClawWin-$v-win-x64.zip"
          & $env:ISCC "/DAppVersion=$v" "/DSourceDir=$PWD\publish" "/DOutputDir=$PWD\dist" installer/DefenseClawWin.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)." }
          Copy-Item installer/install.ps1 dist/install.ps1
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -ne 'checksums.txt' } | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File dist/checksums.txt -Encoding ascii
          Get-Content dist/checksums.txt
      # Unzips the built zip and asserts exactly the two exes, ProductVersion == the version resolved above, and that
      # checksums.txt lists every asset with the right hash.
      - name: Verify release assets
        shell: pwsh
        run: ./tools/release/Test-ReleaseAssets.ps1 -Version '${{ steps.version.outputs.version }}' -Dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    # Only a version tag pushed to this repository gets here: never a pull request (from a fork or not), never a branch push,
    # and not a tag pushed in somebody's fork. That keeps the write token and the signing identity below out of reach of any
    # code that has not been tagged by someone who can push tags here. Nothing is built in this job: it takes the artifact the
    # read-only package job made, checks it again, attests it and publishes it.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !github.event.repository.fork
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write       # create the release and upload its assets
      id-token: write       # sign the provenance attestation (Sigstore, keyless: the workflow's own identity)
      attestations: write   # store the attestation with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Version = the tag, again, independently of the package job. The exes inside the zip must say exactly that.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw "The tag '$env:GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH." }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Verify release assets
        shell: pwsh
        run: ./tools/release/Test-ReleaseAssets.ps1 -Version '${{ steps.version.outputs.version }}' -Dir dist
      # The body: .github/release-notes-template.md filled with the CHANGELOG.md section (or the annotated tag message) and the
      # SHA-256 block. Fails when there is no description.
      - name: Release notes
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --force origin "+refs/tags/${env:TAG}:refs/tags/${env:TAG}"
          $message = git for-each-ref "refs/tags/${env:TAG}" --format='%(contents)'
          ./tools/release/New-ReleaseNotes.ps1 -Version '${{ steps.version.outputs.version }}' -Repo '${{ github.repository }}' `
            -TagMessage ($message -join "`n") -ChecksumsFile dist/checksums.txt -OutFile release-notes.md
      # A signed statement, from this workflow run, of which commit built these exact files. Verify a download with
      #   gh attestation verify <file> --repo <owner>/<repo>
      # (see SECURITY.md). checksums.txt stays in the release as well: it is the plain-text way to check a file.
      # GitHub offers attestations for public repositories (a private one needs GitHub Enterprise Cloud), so while the
      # repository is private this step is skipped instead of failing the release; it applies as soon as it is public.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: DefenseClaw for Windows ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/*
          fail_on_unmatched_files: true
