name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore DefenseClaw.Win.sln
      - name: Build
        run: dotnet build DefenseClaw.Win.sln --no-restore -c Release
      # The whole solution, so both test projects run: DefenseClaw.Tests (Core) and DefenseClaw.App.Tests (the WPF
      # app layer, which needs the Windows desktop runtime that windows-latest has).
      - name: Test
        run: dotnet test DefenseClaw.Win.sln --no-build -c Release --logger "trx"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      # ReadyToRun (not composite) and single-file compression are switched on by DefenseClaw.App.csproj for exactly this
      # self-contained single-file publish, so a local run of this command produces the same exe. The app is not trimmed.
      - name: Publish single-file exe
        run: >
          dotnet publish DefenseClaw.App/DefenseClaw.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem publish/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File publish/checksums.txt -Encoding utf8
          Get-Content publish/checksums.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/*.exe
            publish/checksums.txt
          generate_release_notes: true
